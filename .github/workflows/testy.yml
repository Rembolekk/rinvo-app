name: Testy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: pip install pyyaml

      - name: Testy konfiguracji i zakazów
        run: python -m unittest discover -s tests -v
